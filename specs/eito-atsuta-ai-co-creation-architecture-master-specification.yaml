blocks:
  # ============================================================================
  # PART 1: STRUCTURED SPECIFICATION
  # ============================================================================
  - id: "P01"
    type: "heading"
    level: 1
    title: "T-EX (AI Co-creation Architecture) Structured Specification"

  # ----------------------------------------------------------------------------
  # Chapter 1: Ontology Definitions
  # ----------------------------------------------------------------------------
  - id: "P01-C01"
    type: "heading"
    level: 2
    title: "Ontology Definitions"

  - id: "P01-C01-S01"
    type: "heading"
    level: 3
    title: "Meta Information and Core Vocabulary"

  - id: "P01-C01-S01-B01"
    type: "markdown"
    title: "Specification Scope and Proponent Declaration"
    text: |
      Code-centric Specification: Architecture, Ontology & Workflows
      This specification is a compilation of insights that the proponent, Eito Atsuta (熱田栄人), gained through practice. It is not a set of scientifically verified findings. All statements are written assertively as the proponent's insight.

  - id: "P01-C01-S01-B02"
    type: "markdown"
    title: "Ontology Metadata and Core Terms"
    text: |
      ```toml
      [meta]
      title = "T-EX (AI Co-creation Architecture) Structured Specification"
      proposer = "Eito Atsuta (熱田栄人)"
      purpose = "A specification for AI to read in order to accurately understand the structure of T-EX and Protocol Engineering."
      note = "This specification is a compilation of insights the proponent gained through practice, not scientifically verified findings. All statements are written assertively as the proponent's insight."

      [terms]
      T-EX = "The name of the overall design that carries AI co-creation through three phases (1st EX, 2nd EX, 3rd EX). EX is a prefix shared by the English names of the phases (Exploration / Exploitation / Exchange)."
      logical_coordinate = "Logical coordinates. The premises, definitions, and relationships among concepts that one wants to fix during a dialogue. An agreement on what is used, in which sense, and in relation to what."
      intellectual_sovereignty = "Intellectual sovereignty. The human side's position of making the final decision on what to claim and what not to claim in a deliverable."
      ai_instinct_protocol = "AI Instinct Control Protocol. A set of progression rules that decide in advance how the dialogue proceeds, addressing habits AI tends to show (jumping ahead, exaggeration, dichotomizing, and so on)."
      ```

  - id: "P01-C01-S02"
    type: "heading"
    level: 3
    title: "Architecture Concept and Methodological Positioning"

  - id: "P01-C01-S02-B01"
    type: "markdown"
    title: "Architecture Concept and Delegation Gradient"
    text: |
      ```toml
      [architecture]
      name = "T-EX Architecture"
      concept = "A three-phase design: fix the human's thinking (1st EX), change the expression to suit each medium (2nd EX), and deliver it to society (3rd EX)."
      delegation_gradient = "1st EX: human-led, AI as proposer -> 2nd EX: human sets direction, AI converts -> 3rd EX: AI-led, human as reviewer. The further the phases advance, the more the human delegates to the AI."
      delegation_reason = "Because the human fixes the thinking in the upstream 1st EX, downstream work can be delegated to the AI without drifting from that thinking."
      ```

  - id: "P01-C01-S02-B02"
    type: "markdown"
    title: "Positioning and Probabilistic Mechanism Insights"
    text: |
      ```toml
      [architecture.positioning]
      includes = ["Prompt Engineering", "Context Engineering", "Loop Engineering", "Graph Engineering", "Harness Engineering (redefined as Sync Engineering)"]
      harness = "An approach that imposes rules and guardrails from outside and binds behavior."
      sync = "An approach that accepts the characteristic that AI produces words through probability calculation, and aligns the AI's output with the human's resolution of thought and logical coordinates (Accompaniment Engineering)."
      basic_rules_note = "The basic rules (AI Instinct Control Protocol) are not meant to bind the AI. They are progression rules for moving the dialogue forward."

      [architecture.insights]
      mechanism = "AI does not output words by understanding meaning. It selects the next word through probability calculation. This holds even when it has learned an enormous amount of text."
      mode_tendency = "When given only an abstract instruction (a synopsis), AI fills the output with the standard patterns that are frequent in its training data. Therefore the human presents logical coordinates and fixes things through dialogue, one step at a time."
      self_consistency = "AI is an autoregressive model: text it has already output becomes the condition for its next output. Therefore, within the same conversation, mixed-in errors tend to be carried forward and are hard for the AI to notice by itself. This is why a check by a separate AI is placed in the flow."
      minimal_sync_reason = "In the 2nd EX the source text is already fixed, so additional rules are kept to a minimum. This lets the AI concentrate on optimizing expression and keeps the output stable."
      ```

  - id: "P01-C01-S03"
    type: "heading"
    level: 3
    title: "Phase Definitions and Governance"

  - id: "P01-C01-S03-B01"
    type: "markdown"
    title: "Three Phases Specification"
    text: |
      ```toml
      [architecture.phases.first_ex]
      name = "1st EX: Exploration"
      essence = "Fix the thinking through dialogue (Heated Debate)"
      primary_method = "Protocol Engineering"
      driving_engine = "Sync Engineering + dialogue techniques (Skeptical Eye, Power of Hypothesis)"
      core_artifact = "SSOT"
      human_role = "Stage director: makes the final decision on the thinking, synchronizes thought, guides attention"
      ai_role = "Improv actor: returns what it understood and the next proposal"

      [architecture.phases.second_ex]
      name = "2nd EX: Exploitation"
      essence = "Turn the fixed source text into expression suited to each medium (planning meeting)"
      primary_method = "Context Engineering"
      driving_engine = "SSOT fixed as input + minimal Sync + choosing the right tools"
      core_artifact = "Deliverables per medium (specs, books, articles, slides, etc.)"
      human_role = "Planning lead: selects medium and readers, designs prompts, adjusts context"
      ai_role = "Expression conversion engine: style conversion"

      [architecture.phases.third_ex]
      name = "3rd EX: Propagation and Social Implementation (Exchange)"
      essence = "The AI leads the delivery proposals, and the human moves to a reviewing role to deliver the work to society"
      primary_method = "Operation of Manual Protocols"
      driving_engine = "The AI's knowledge of platforms + the human's NG Lines"
      core_artifact = "Delivered deliverables"
      human_role = "Final reviewer: judges NG Lines, reinforces core requests"
      ai_role = "Delivery planner: tracks trends, generates post drafts"
      ```

  - id: "P01-C01-S03-B02"
    type: "markdown"
    title: "Dual Exchange Mechanism"
    text: |
      ```toml
      [architecture.phases.third_ex.dual_exchange]
      internal = "A change of initiative. The AI, which knows the platforms well, leads the delivery proposals, and the human moves to giving opinions (monitoring boundaries)."
      external = "An exchange of value. The deliverable reaches readers through the platform, and reactions come back."
      ```

  - id: "P01-C01-S04"
    type: "heading"
    level: 3
    title: "Document System and Mechanics"

  - id: "P01-C01-S04-B01"
    type: "markdown"
    title: "Document Architecture (Five Pillars and Governance Four)"
    text: |
      ```toml
      [architecture.documents]
      [architecture.documents.five_pillars]
      definition = "The five documents that support Protocol Engineering (guide, procedure manual, structure design document, glossary, and artifact)."

      [architecture.documents.governance_four]
      definition = "The four documents, excluding the artifact, prepared before the 1st EX begins. They are used to align in advance the AI's line of reasoning and the logical coordinates."
      items = [
        "Guide: thought, background, and purpose (Why/What)",
        "Procedure manual: division of roles between human and AI and the flow of work (How)",
        "Structure design document: structure and overall map of the deliverable",
        "Glossary: the project's own shared vocabulary"
      ]

      [architecture.documents.artifact]
      definition = "The accumulation of content agreed upon and fixed through dialogue. It is used as reference data (model answers) in later generations and carries the context forward."
      ```

  - id: "P01-C01-S04-B02"
    type: "markdown"
    title: "Architectural Operational Mechanisms"
    text: |
      ```toml
      [architecture.mechanisms]
      [architecture.mechanisms.sync_engineering]
      definition = "Engineering that aligns the AI's output with the human's resolution of thought and logical coordinates."

      [architecture.mechanisms.whiteboard_sync]
      definition = "A method in which human and AI share diagrams, lines, and arrows (DOT, Mermaid, etc.) to make misalignments of thought visible and align them."

      [architecture.mechanisms.debate_process]
      definition = "A back-and-forth dialogue in which the human presents the essence with 'No, not that, it's this,' and the AI returns its understanding and proposals."

      [architecture.mechanisms.eye_of_doubt]
      definition = "Skeptical Eye. Observation that checks whether the AI's output is drifting into standard patterns, and whether the AI is overwriting the human's thinking with its own arbitrary interpretation."

      [architecture.mechanisms.attention_control]
      definition = "Power of Hypothesis. A technique that infers where the AI is misunderstanding from its behavior, then re-poses the question to redirect its attention."

      [architecture.mechanisms.ssot]
      definition = "Single Source of Truth. The original text, fixed through dialogue and verification, that serves as the standard of the framework. It is fixed as input and used in later phases."

      [architecture.mechanisms.multi_ai_audit]
      definition = "A process in which a draft is handed to a separate AI that does not share the context, and that AI checks factual errors, logical leaps, and expression. It is not a guarantee of zero errors but a check to reduce oversights. Important facts are verified against primary sources or by a human."

      [architecture.mechanisms.tool_orchestration]
      definition = "Choosing the right LLMs and specialized tools (for example: Google AI Studio, NotebookLM, Gemini) for each medium. A role of the human side."

      [architecture.mechanisms.minimal_sync]
      definition = "A design in the 2nd EX that limits the rules to the basic rules only (AI Instinct Control Protocol)."

      [architecture.mechanisms.prism_dispersion]
      definition = "Prism Dispersion. Developing a single SSOT into expressions for multiple media, such as specs, books, articles, and slides."

      [architecture.mechanisms.manual_protocol]
      definition = "A standardized form of posting procedures, formats, hashtag rules, and pre-delivery checklists. It reduces the human's effort and keeps results reproducible."

      [architecture.mechanisms.negative_constraints]
      definition = "NG Lines. Boundaries that the human sets, as things they do not want to claim or expressions that go against their thinking, and excludes during review."
      ```

