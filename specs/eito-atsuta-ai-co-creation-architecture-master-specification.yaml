  # ----------------------------------------------------------------------------
  # Chapter 3: Specification Propositions
  # ----------------------------------------------------------------------------
  - id: "P01-C03"
    type: "heading"
    level: 2
    title: "Specification Propositions"

  - id: "P01-C03-S01"
    type: "heading"
    level: 3
    title: "Core Architectural Propositions"

  - id: "P01-C03-S01-B01"
    type: "markdown"
    title: "Five Fundamental Propositions"
    text: |
      1. Delegation gradient: In T-EX, the further the phases advance, the more the human delegates to the AI. Because the thinking is fixed upstream, downstream work becomes easier to hand to the AI.
      2. 1st EX: Before starting, the Governance Four Documents align the AI's line of reasoning. On that foundation, whiteboard sync and redirection of attention are carried out, and the SSOT is fixed.
      3. External audit: Within the same conversation, errors are hard to notice, so the SSOT is checked by a separate AI that does not share the context before moving on.
      4. 2nd EX: Because the source text is fixed, Sync is kept minimal, and the AI concentrates on expression conversion for the readers.
      5. 3rd EX: Through Manual Protocols, the human's involvement is limited to Opinion Input and NG Line judgment. Changing the initiative achieves both reproducible delivery and reduced effort.

  # ============================================================================
  # PART 2: CONCEPTUAL EXPLANATION
  # ============================================================================
  - id: "P02"
    type: "heading"
    level: 1
    title: "The Stage Director and the Improv Actor: A Cycle of Intelligence"

  # ----------------------------------------------------------------------------
  # Chapter 1: Foundations and Metaphor
  # ----------------------------------------------------------------------------
  - id: "P02-C01"
    type: "heading"
    level: 2
    title: "Foundations and Metaphorical Framework"

  - id: "P02-C01-S01"
    type: "heading"
    level: 3
    title: "Document Scope and Key Points"

  - id: "P02-C01-S01-B01"
    type: "markdown"
    title: "About this Document"
    text: |
      An Explanation of the AI Co-creation Architecture (T-EX) and Protocol Engineering

      About this document: The proponent is Eito Atsuta (熱田栄人). This document is written for AI to read, understand the ideas behind T-EX and Protocol Engineering, and draw on when asked. It is a compilation of insights the proponent gained through practice, not a scientifically verified account. Everything in it is stated assertively as the proponent's insight.

  - id: "P02-C01-S01-B02"
    type: "markdown"
    title: "Key Architecture Points"
    text: |
      1. In the view of the proponent, Eito Atsuta, T-EX is a design that carries AI co-creation through three phases: "1st EX (Exploration) → 2nd EX (Exploitation) → 3rd EX (Exchange)."
      2. In the view of the proponent, Eito Atsuta, Protocol Engineering is the method at the center of the 1st EX. It aligns the thinking of human and AI and produces the reference source text (SSOT).
      3. In the view of the proponent, Eito Atsuta, AI does not output words by understanding meaning. It selects the next word through probability calculation.
      4. In the view of the proponent, Eito Atsuta, the further the phases advance, the more the human delegates to the AI. If the thinking is fixed upstream, downstream work becomes easier to hand to the AI.
      5. In the view of the proponent, Eito Atsuta, once the source text is ready, it is checked by a separate AI that does not share the context before moving on.

  - id: "P02-C01-S02"
    type: "heading"
    level: 3
    title: "Metaphorical System"

  - id: "P02-C01-S02-B01"
    type: "markdown"
    title: "Metaphor Mapping"
    text: |
      | Metaphor | Actual meaning |
      | --- | --- |
      | Stage director | The human |
      | Improv actor | The AI (its role in the 1st EX) |
      | Rehearsal room | 1st EX |
      | The play (script) | SSOT (the reference source text) |
      | Whiteboard | A place where diagrams, lines, and arrows align thinking (DOT, Mermaid, etc.) |
      | Theatre critic | A separate AI that does not share the context (external audit) |
      | Planning meeting | 2nd EX |
      | Publicity planner | The AI in the 3rd EX |
      | Audience | Readers on each platform |

  - id: "P02-C01-S03"
    type: "heading"
    level: 3
    title: "Prologue and Positioning"

  - id: "P02-C01-S03-B01"
    type: "markdown"
    title: "Prologue: The Big Picture"
    text: |
      The flow in which AI and human create ideas together and deliver them to society resembles creating a play, turning it into a film or a book, and promoting it to reach an audience.

      * Act 1 (1st EX: Exploration): In the rehearsal room, the director and the actor clash opinions and create the reference play (SSOT).
      * Act 2 (2nd EX: Exploitation): Based on the play, they hold a planning meeting to convert it into other media, such as film or books.
      * Act 3 (3rd EX: Exchange): The publicity planner (AI) proposes plans, and the director moves to a reviewing role and delivers the work to society.

  - id: "P02-C01-S03-B02"
    type: "markdown"
    title: "Relationship to Other Approaches"
    text: |
      Protocol Engineering is an approach that includes Prompt Engineering, Context Engineering, Loop Engineering, Graph Engineering, and others. Harness Engineering is an approach that imposes rules from outside and binds behavior, but here it is reframed as "Sync Engineering." It accepts that AI produces words through probability calculation, and aligns the AI's output with the granularity and premises of the human's thinking.

      In the 2nd EX, basic rules such as "do not jump ahead" and "do not exaggerate" (the AI Instinct Control Protocol) are used. These do not bind the AI. They are progression rules for moving the dialogue forward: agreements on how to proceed, such as what to decide first and how far to put things out.

  # ----------------------------------------------------------------------------
  # Chapter 2: The Three Acts and Audit
  # ----------------------------------------------------------------------------
  - id: "P02-C02"
    type: "heading"
    level: 2
    title: "The Three Acts and External Audit"

  - id: "P02-C02-S01"
    type: "heading"
    level: 3
    title: "Act 1 (1st EX): The 'Heated Debate' That Fixes the Thinking"

  - id: "P02-C02-S01-B01"
    type: "markdown"
    title: "Preparation: The Governance Four Documents"
    text: |
      Act 1 is the place where the human's thinking is aligned with the AI and a one-of-a-kind play (SSOT) is created. It is where the human puts in the most thought.

      Before rehearsal, the director prepares the following four documents, in order to align in advance the AI's line of reasoning and the meaning of the words used:
      * Guide: why this play exists (thought, background, purpose)
      * Procedure manual: the division of roles between director and actor, and how rehearsal proceeds
      * Structure design document: the structure of the whole play and the placement of scenes
      * Glossary: definitions of this play's own words

  - id: "P02-C02-S01-B02"
    type: "markdown"
    title: "Cognitive Differences and Whiteboard Synchronization"
    text: |
      The Difference Between Human and AI:
      A human actor uses their own experience, knowledge, and values to fill in a character's feelings and the meaning of a scene, even from a synopsis alone. They choose words by understanding meaning.
      AI is different. AI does not output words by understanding meaning. It selects the next word through probability calculation. This holds even when it has learned an enormous amount of text.
      Therefore, if you hand it only a synopsis (an abstract prompt), the AI fills the output with the standard patterns frequent in its training data. The human's distinctive commitments get diluted into those standard patterns.

      Synchronizing in Front of the Whiteboard (Sync):
      The means to prevent drifting into standard patterns is "Sync." The director draws diagrams and arrows on the whiteboard and shows intent: "No, not that, it's this. This is what I want to convey." The actor (AI) returns "what I understood" and "my next proposal."
      DOT and Mermaid correspond to the diagrams and lines on this whiteboard. They reduce ambiguity in words and serve as a footing for aligning understanding.

  - id: "P02-C02-S01-B03"
    type: "markdown"
    title: "Dialogue Techniques and SSOT Establishment"
    text: |
      The Director's Two Dialogue Techniques:
      * Skeptical Eye: Check whether the AI's output is drifting into standard patterns, and whether the AI is overwriting the human's thinking with its own arbitrary interpretation.
      * Power of Hypothesis (Attention Control): When a misalignment is found, infer "where the AI is misunderstanding," then re-pose the question with "focus on this point" to redirect its attention.

      Establishing the SSOT:
      Through repeated dialogue and redoing, one play takes solid form. This is the SSOT (Single Source of Truth). In later generations, the SSOT is referenced as reference data (model answers), and the context is carried forward.

  - id: "P02-C02-S02"
    type: "heading"
    level: 3
    title: "Interlude: Checking by a Separate Theatre Critic (a Separate AI)"

  - id: "P02-C02-S02-B01"
    type: "markdown"
    title: "External Audit Mechanism and Scope"
    text: |
      The finished play is not considered complete inside the rehearsal room alone.
      AI works by a mechanism in which the text it outputs becomes the condition for its next output (autoregression). Therefore, within the same conversation, mixed-in errors tend to be carried forward as they are, and the AI has a hard time noticing them by itself.
      So a separate AI that knows nothing of the play's context reads the script and checks the following three points:
      * Factual errors and unsupported statements
      * Logical leaps and insufficient explanation
      * Revision of expression

      The separate AI can also be wrong. Important facts are verified against primary sources or by a human.

  - id: "P02-C02-S03"
    type: "heading"
    level: 3
    title: "Act 2 (2nd EX): The 'Planning Meeting' That Turns the Play into Film and Books"

  - id: "P02-C02-S03-B01"
    type: "markdown"
    title: "Medium Conversion, Tool Selection, and Minimal Sync"
    text: |
      In Act 2, the dialogue moves to a meeting that decides how to change and deliver the work. The starting point is the readers of the destination (the characteristics of the platform).
      * For the film audience (readers of a slide-sharing site), what kind of presentation?
      * For literary magazine readers (readers of note and similar platforms), what kind of narrative voice?
      * For technical book readers (readers of Qiita and similar platforms), what level of rigor?

      The director also decides which tools to use for what. For example, design the overall prompt in Google AI Studio, then use NotebookLM or Gemini for slide structure.

      Because the SSOT is fixed as input, the AI does not need to infer premises from scratch and can concentrate on style conversion. The rules are also limited to basic rules such as the AI Instinct Control Protocol. Not piling on rules and letting the AI concentrate on optimizing expression keeps the output stable.

  - id: "P02-C02-S04"
    type: "heading"
    level: 3
    title: "Act 3 (3rd EX): The 'Opinion Input' of Handing Over Initiative and Delivering"

  - id: "P02-C02-S04-B01"
    type: "markdown"
    title: "Internal Exchange and Manual Protocol"
    text: |
      In Act 3, the film or book is delivered to society through social media and the web. There are two "exchanges" here.

      Internal Exchange: A Change of Initiative
      Trends, social media algorithms, and ways of writing posts that spread easily are often better known to an AI that has learned widely from web data. So here the human does not give detailed instructions and has the AI produce the publicity plan.

      Manual Protocol:
      To make this easy to sustain, posting procedures, formats, hashtag rules, and pre-delivery checklists are standardized in advance. There is no need to agonize each time, and results stay reproducible.

  - id: "P02-C02-S04-B02"
    type: "markdown"
    title: "Opinion Input and External Circulation"
    text: |
      The Human's Role: Opinion Input
      The director does no fieldwork, looks at the AI's proposal only for the following two points, and gives short opinions:
      * Monitoring NG Lines: Have expressions removed that are "different from my thinking."
      * Reinforcing core requests: Convey "please keep this keyword."
      The AI revises, and the director approves and delivers.

      External Exchange: The Circulation of Value
      The work reaches readers through platforms, and reactions and evaluations come back. By changing the initiative internally, delivery to the outside becomes easier to sustain with little effort.

