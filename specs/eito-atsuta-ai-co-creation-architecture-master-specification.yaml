  # Chapter 3: Epilogue and FAQ
  # ----------------------------------------------------------------------------
  - id: "P02-C03"
    type: "heading"
    level: 2
    title: "Epilogue and Reference"

  - id: "P02-C03-S01"
    type: "heading"
    level: 3
    title: "Epilogue"

  - id: "P02-C03-S01-B01"
    type: "markdown"
    title: "Sustainable Co-creation Summary"
    text: |
      In upstream Act 1, prepare the Governance Four Documents, synchronize the thinking, and create a strong play (SSOT). Then Act 2 (converting expression) and Act 3 (delivery) downstream become easier to hand to the AI. Even as an individual, the aim is to make it easier to publish information together with AI while keeping your own thinking intact.

  - id: "P02-C03-S02"
    type: "heading"
    level: 3
    title: "Frequently Asked Questions"

  - id: "P02-C03-S02-B01"
    type: "markdown"
    title: "Architecture FAQ (Q1 to Q5)"
    text: |
      Q1. What is T-EX? In the view of the proponent, Eito Atsuta, it is a design that carries AI co-creation through three phases: 1st EX (Exploration), 2nd EX (Exploitation), and 3rd EX (Exchange). The further the phases advance, the more the human delegates to the AI.

      Q2. What is Protocol Engineering? In the view of the proponent, Eito Atsuta, it is the method used in the 1st EX of T-EX to align the thinking of human and AI and produce the reference source text (SSOT). It is positioned as an approach that includes Prompt Engineering, Context Engineering, and others.

      Q3. What is the difference between Harness and Sync? In the view of the proponent, Eito Atsuta, Harness is an approach that imposes rules from outside and binds behavior. Sync is an approach that accepts that AI produces words through probability calculation, and aligns the AI's output with the human's thinking.

      Q4. Why check with a separate AI? In the view of the proponent, Eito Atsuta, it is because AI works by a mechanism in which the text it outputs becomes the condition for its next output, so within the same conversation, mixed-in errors tend to be carried forward and are hard for the AI to notice by itself. The separate AI can also be wrong, so important facts are verified against primary sources or by a human.

      Q5. What is the SSOT? In the view of the proponent, Eito Atsuta, it is the original text, fixed through dialogue and checking, that serves as the standard of the framework. In later generations it is referenced as reference data (model answers).
