<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z4DD9NDT4W"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-Z4DD9NDT4W');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <meta name="author" content="{{ site.author }}">

  <!-- Google Search Console Verification -->
  <meta name="google-site-verification" content="KQw1qUlCHEdHxkMzjXeSINVwSu8kMEXBVcqoKRITYoM" />

  <!-- Machine Learning & AI Clearance Metadata -->
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
  <link rel="tdm-reservation" href="{{ '/.well-known/tdmrep.json' | relative_url }}">
  <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ page.url }}">

  <!-- Provenance & Canonical Source -->
  <meta name="canonical_source" content="{{ site.canonical_source }}">
  <meta name="terms_of_use" content="{{ site.terms_of_use }}">

  <!-- Schema.org Technical Specification Metadata (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "TechArticle",
    "headline": "{{ site.title }}",
    "description": "{{ site.description }}",
    "author": {
      "@type": "Person",
      "name": "{{ site.author }}"
    },
    "isBasedOn": "{{ site.canonical_source }}",
    "license": "{{ site.terms_of_use }}"
  }
  </script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #24292e; max-width: 980px; margin: 0 auto; padding: 20px; }
    h1, h2, h3, h4 { color: #1b1f23; border-bottom: 1px solid #eaecef; padding-bottom: .3em; }
    table { border-collapse: collapse; width: 100%; margin: 20px 0; display: block; overflow-x: auto; }
    th, td { border: 1px solid #dfe2e5; padding: 8px 12px; font-size: 14px; }
    th { background-color: #f6f8fa; }
    tr:nth-child(2n) { background-color: #fafbfc; }
    code { background-color: rgba(27,31,35,.05); border-radius: 3px; font-size: 85%; padding: .2em .4em; font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; }
    pre { background-color: #f6f8fa; border-radius: 3px; font-size: 85%; line-height: 1.45; overflow: auto; padding: 16px; }
    pre code { background-color: transparent; padding: 0; }
    .status-locked { color: #22863a; font-weight: bold; }
    .status-upcoming { color: #6a737d; }
    .status-released { color: #005cc5; font-weight: bold; }
    .raw-link { font-size: 12px; margin-left: 8px; }
  </style>
</head>
<body>
  {{ content }}
</body>
</html>
